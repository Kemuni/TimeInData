[project]
name = "api-service"
version = "0.1.0"
description = "API Service for TimeInData project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.0",
    "faststream[rabbit]>=0.6.5",
    "greenlet>=3.3.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.45",
    "testcontainers[postgres]>=4.13.3",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "freezegun>=1.5.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgres]>=4.13.3",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    ".."
]
testpaths = ["tests"]
# Asyncio options
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # for correct import of other modules (e.g., logger in app.py)
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",  # There is lib warning about deprecation
]


[tool.coverage.run]
source=["app"]
dynamic_context = "test_function"
concurrency = ["thread", "greenlet"]  # You can't trace a return statement in endpoints without it


[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__"
]

[tool.coverage.html]
show_contexts = true
